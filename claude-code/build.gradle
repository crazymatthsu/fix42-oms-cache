plugins {
    // Applied (not activated) at the root so subprojects can apply it without re-declaring the version.
    alias(libs.plugins.protobuf) apply false
}

// Version-catalog type-safe accessors (`libs`) are NOT generated inside the
// `subprojects {}` closure of the root script, so JUnit coordinates are pinned
// here directly. Keep in sync with gradle/libs.versions.toml.
def junitVersion = '5.11.4'
def junitLauncherVersion = '1.11.4'

subprojects {
    apply plugin: 'java-library'

    group = 'com.fix42.oms'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(23)
        }
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitLauncherVersion}"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat 'full'
        }
    }
}
