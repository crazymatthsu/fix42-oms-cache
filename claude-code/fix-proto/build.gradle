plugins {
    id 'com.google.protobuf'
}

dependencies {
    // Generated protobuf classes expose protobuf-java on their public API surface,
    // so downstream modules (fix-codec, oms-cache) get it transitively.
    api libs.protobuf.java
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.get()}"
    }
}
