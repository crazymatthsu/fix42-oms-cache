syntax = "proto3";

package fix42.oms;

option java_package = "com.fix42.oms.proto";
option java_multiple_files = true;
option java_outer_classname = "FixProto";

message FixField {
  int32 tag = 1;
  string value = 2;
}

message FixGroupInstance {
  repeated FixField fields = 1;
  repeated FixGroup nested_groups = 2;
}

message FixGroup {
  int32 num_in_group_tag = 1;
  repeated FixGroupInstance instances = 2;
}

message FixHeader {
  optional string begin_string = 1;
  optional int32 body_length = 2;
  optional string msg_type = 3;
  optional string sender_comp_id = 4;
  optional string target_comp_id = 5;
  optional int32 msg_seq_num = 6;
  optional string sending_time = 7;
  repeated FixField extra = 8;
}

message FixTrailer {
  optional string check_sum = 1;
}

message FixMessage {
  FixHeader header = 1;
  repeated FixField fields = 2;
  repeated FixGroup groups = 3;
  FixTrailer trailer = 4;
  optional string raw = 5;
}
